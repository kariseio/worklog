[workspace]
resolver = "3"
members = [
    "crates/worklog-core",
    "crates/worklog-cli",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/kariseio/worklog"
authors = ["kariseio"]

[workspace.dependencies]
worklog-core = { path = "crates/worklog-core" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }

# 성능 우선 릴리스 프로필: 전체 LTO, 단일 코드젠 유닛, 심볼 제거.
# panic 은 unwind 유지 — 앱 셸의 catch_unwind / 수집 스레드 join 폴백이 abort 에서는 동작하지 않는다.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

# 개발 중에도 의존성은 최적화해 수집기 벤치가 왜곡되지 않게 한다.
[profile.dev.package."*"]
opt-level = 2
